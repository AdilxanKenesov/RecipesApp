[versions]
agp = "9.3.3"
coilCompose = "3.6.2"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.20"
composeBom = "2026.09.00"
orbitCore = "12.0.1"
orbitTest = "12.0.1"
orbitViewmodel = "12.0.1"
